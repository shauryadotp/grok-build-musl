# Build statically-linked Linux binaries of Grok Build (xai-grok-pager)
# for x86_64-unknown-linux-musl and aarch64-unknown-linux-musl.

name: musl

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    paths:
      - ".github/workflows/musl.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "SOURCE_REV"
      - ".cargo/**"
      - "crates/**"
      - "bin/**"
  pull_request:
    paths:
      - ".github/workflows/musl.yml"

concurrency:
  group: musl-\( {{ github.workflow }}- \){{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  PROTOC: ${{ github.workspace }}/bin/protoc
  SYSTEM_DEPS_DAV1D_BUILD_INTERNAL: auto
  TARGET_CFLAGS: "-D_GNU_SOURCE"
  CFLAGS_x86_64_unknown_linux_musl: "-D_GNU_SOURCE"
  CFLAGS_aarch64_unknown_linux_musl: "-D_GNU_SOURCE"
  JEMALLOC_SYS_WITH_BACKGROUND_THREADS: "0"
  je_cv_pthread_getname_np: "no"
  je_cv_secure_getenv: "no"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            musl_cc: musl-gcc
            cc_env: CC_x86_64_unknown_linux_musl
            linker_env: CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            musl_cc: musl-gcc
            cc_env: CC_aarch64_unknown_linux_musl
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang llvm lld nasm \
            musl-tools musl-dev protobuf-compiler \
            ca-certificates curl file binutils
          ${{ matrix.musl_cc }} --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: musl-${{ matrix.target }}-noj
          shared-key: grok-build
          cache-on-failure: true

      - name: Install DotSlash (hermetic bin/protoc)
        run: |
          cargo install dotslash --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          /usr/bin/env dotslash --help

      - name: Warm hermetic protoc
        run: |
          chmod +x bin/protoc || true
          bin/protoc --version || {
            echo "bin/protoc (DotSlash) failed; falling back to system protoc"
            echo "PROTOC=$(which protoc)" >> "$GITHUB_ENV"
            protoc --version
          }

      - name: Build release (musl)
        env:
          TARGET_CC: ${{ matrix.musl_cc }}
        run: |
          set -euo pipefail
          export \( {{ matrix.cc_env }}=" \){{ matrix.musl_cc }}"
          export \( {{ matrix.linker_env }}=" \){{ matrix.musl_cc }}"

          cargo build \
            --locked \
            --release \
            -p xai-grok-pager-bin \
            --target ${{ matrix.target }} \
            --no-default-features \
            --features sandbox-enforce

      - name: Dump native build logs
        if: failure()
        run: |
          echo "::group::jemalloc / cc config.logs"
          find target -name config.log -print -exec tail -n 80 {} \; || true
          echo "::endgroup::"
          echo "::group::failed crate stderr"
          find target -path '*build*/output' -print -exec tail -n 40 {} \; 2>/dev/null || true
          echo "::endgroup::"

      - name: Package + verify static link
        id: pkg
        run: |
          set -euo pipefail
          SRC="target/${{ matrix.target }}/release/xai-grok-pager"
          test -x "$SRC"

          DEST_DIR="${{ runner.temp }}/dist"
          mkdir -p "$DEST_DIR"
          cp -a "$SRC" "$DEST_DIR/grok"
          strip "$DEST_DIR/grok" || true
          chmod +x "$DEST_DIR/grok"

          echo "== file =="
          file "$DEST_DIR/grok"
          echo "== ldd =="
          ldd "$DEST_DIR/grok" || true
          "$DEST_DIR/grok" --version || true

          ARCHIVE="grok-${{ matrix.target }}.tar.gz"
          tar -C "$DEST_DIR" -czf "$ARCHIVE" grok
          sha256sum "\( ARCHIVE" | tee " \){ARCHIVE}.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha256=${ARCHIVE}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok-${{ matrix.target }}
          path: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.sha256 }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Download all musl artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
