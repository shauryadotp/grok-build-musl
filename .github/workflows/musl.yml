# Build statically-linked Linux binaries of Grok Build (xai-grok-pager)
# for x86_64-unknown-linux-musl and aarch64-unknown-linux-musl.
#
# Source tree: https://github.com/xai-org/grok-build

name: musl

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    paths:
      - ".github/workflows/musl.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "crates/**"
      - "bin/**"
  pull_request:
    paths:
      - ".github/workflows/musl.yml"

concurrency:
  group: musl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PROTOC: ${{ github.workspace }}/bin/protoc
  SYSTEM_DEPS_DAV1D_BUILD_INTERNAL: auto

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            musl_cc: musl-gcc
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            musl_cc: musl-gcc

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang llvm nasm \
            musl-tools musl-dev protobuf-compiler \
            ca-certificates curl file binutils
          ${{ matrix.musl_cc }} --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: musl-${{ matrix.target }}
          shared-key: grok-build
          cache-on-failure: true

      - name: Install DotSlash (hermetic bin/protoc)
        run: |
          cargo install dotslash --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          /usr/bin/env dotslash --help

      - name: Warm hermetic protoc
        run: |
          chmod +x bin/protoc || true
          bin/protoc --version || {
            echo "bin/protoc (DotSlash) failed; falling back to system protoc"
            echo "PROTOC=$(which protoc)" >> "$GITHUB_ENV"
          }

      - name: Build release (musl)
        env:
          CC: ${{ matrix.musl_cc }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --locked --release \
            -p xai-grok-pager-bin \
            --target ${{ matrix.target }}

      - name: Package + verify static link
        id: pkg
        run: |
          set -euo pipefail
          SRC="target/${{ matrix.target }}/release/xai-grok-pager"
          test -x "$SRC"
          DEST_DIR="${{ runner.temp }}/dist"
          mkdir -p "$DEST_DIR"
          cp -a "$SRC" "$DEST_DIR/grok"
          strip "$DEST_DIR/grok" || true
          chmod +x "$DEST_DIR/grok"
          file "$DEST_DIR/grok"
          ldd "$DEST_DIR/grok" || true
          "$DEST_DIR/grok" --version || true
          ARCHIVE="grok-${{ matrix.target }}.tar.gz"
          tar -C "$DEST_DIR" -czf "$ARCHIVE" grok
          sha256sum "$ARCHIVE" | tee "${ARCHIVE}.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha256=${ARCHIVE}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok-${{ matrix.target }}
          path: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.sha256 }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Download all musl artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
